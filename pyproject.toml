[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rascaljax"
version = "0.1.0"
description = "RascalJax: importance-sampled 2PCF covariance matrices (RascalC rewritten in JAX)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "jax>=0.4.30"]

[project.optional-dependencies]
lsstypes = ["lsstypes"]
pycorr = ["pycorr"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["rascaljax*"]
